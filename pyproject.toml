[project]
name = "sql-agent"
version = "0.1.0"
description = "A minimal SQL agent scaffold built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.18",
    "langchain-deepseek>=1.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "agentevals>=0.0.9",
    "openevals>=0.2.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "eval: runs the agent against the live model and costs API credits",
]
