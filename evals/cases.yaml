    SELECT d.forename, d.surname, COUNT(DISTINCT res.raceId) AS races, ROUND(SUM(res.points) / COUNT(DISTINCT res.raceId), 3) AS points_per_race FROM results AS res JOIN drivers AS d ON d.driverId = res.driverId JOIN races AS r ON r.raceId = res.raceId WHERE r.year BETWEEN 2014 AND 2017 GROUP BY d.driverId, d.forename, d.surname HAVING COUNT(DISTINCT res.raceId) >= 20 ORDER BY points_per_race DESC, d.driverId LIMIT 5
