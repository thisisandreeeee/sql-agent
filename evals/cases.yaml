- name: formula_1_060
  question: "What are the drivers' last names and id who had 11 pit stops and participated in more than 5 race results?"
  reference_answer: >-
    No drivers had both 11 pit stops and more than 5 race results.
  gold_sql: |
    SELECT T1.surname ,  T1.driverid FROM drivers AS T1 JOIN pitstops AS T2 ON T1.driverid  =  T2.driverid GROUP BY T1.driverid HAVING count(*)  =  11 INTERSECT SELECT T1.surname ,  T1.driverid FROM drivers AS T1 JOIN results AS T2 ON T1.driverid  =  T2.driverid GROUP BY T1.driverid HAVING count(*)  >  5
- name: formula_1_062
  question: "What is the id and last name of the driver who participated in the most races after 2010?"
  reference_answer: >-
    Drivers 1, Hamilton, and 20, Vettel, tied for the most races after 2010,
    with 137 races each.
  gold_sql: |
    SELECT T1.driverid, T1.surname
    FROM drivers AS T1
    JOIN results AS T2 ON T1.driverid = T2.driverid
    JOIN races AS T3 ON T2.raceid = T3.raceid
    WHERE T3.year > 2010
    GROUP BY T1.driverid, T1.surname
    HAVING count(*) = (
      SELECT max(race_count)
      FROM (
        SELECT count(*) AS race_count
        FROM results AS T4
        JOIN races AS T5 ON T4.raceid = T5.raceid
        WHERE T5.year > 2010
        GROUP BY T4.driverid
      )
    )
