advanced:
- name: advanced_001
  question: Which three drivers improved their points per race the most from 2014-2015 to 2016-2017 among drivers with at
    least 20 race entries in each period? For each driver, report both rates, the change, and the number of races in each
    period.
  reference_answer: Kimi R�_ikk̦nen improved the most, from 5.395 points per race across 38 races to 9.537 across 41, a gain
    of 4.142. Daniel Ricciardo was second, improving from 8.684 across 38 races to 11.122 across 41, a gain of 2.438. Nico
    Rosberg was third, improving from 16.816 across 38 races to 18.333 across 21, a gain of 1.518.
  gold_sql: |-
    WITH period_stats AS (
      SELECT r.driverId,
             CASE WHEN ra.year BETWEEN 2014 AND 2015 THEN 'baseline' ELSE 'recent' END AS period,
             COUNT(DISTINCT r.raceId) AS races,
             SUM(COALESCE(r.points, 0.0)) AS points
      FROM results AS r
      JOIN races AS ra ON ra.raceId = r.raceId
      WHERE ra.year BETWEEN 2014 AND 2017
      GROUP BY r.driverId, period
    ), comparison AS (
      SELECT driverId,
             MAX(CASE WHEN period = 'baseline' THEN races END) AS baseline_races,
             MAX(CASE WHEN period = 'baseline' THEN points END) AS baseline_points,
             MAX(CASE WHEN period = 'recent' THEN races END) AS recent_races,
             MAX(CASE WHEN period = 'recent' THEN points END) AS recent_points
      FROM period_stats
      GROUP BY driverId
    )
    SELECT d.driverId, d.forename, d.surname,
           baseline_races,
           ROUND(baseline_points / baseline_races, 3) AS baseline_points_per_race,
           recent_races,
           ROUND(recent_points / recent_races, 3) AS recent_points_per_race,
           ROUND(recent_points / recent_races - baseline_points / baseline_races, 3) AS improvement
    FROM comparison AS x
    JOIN drivers AS d ON d.driverId = x.driverId
    WHERE baseline_races >= 20 AND recent_races >= 20
    ORDER BY recent_points / recent_races - baseline_points / baseline_races DESC,
             recent_points / recent_races DESC,
             d.driverId
    LIMIT 3
- name: advanced_002
  question: Which three drivers had the best pole-to-win conversion rate across their careers, considering only drivers who
    started from pole at least 10 times? Report wins from pole, pole starts, and the conversion percentage.
  reference_answer: Alberto Ascari had the best pole-to-win conversion rate at 64.3%, winning 9 of 14 races started from pole.
    Fernando Alonso was second at 63.6% with 14 wins from 22 poles, and Michael Schumacher was third at 58.8% with 40 wins
    from 68 poles.
  gold_sql: |-
    WITH pole_stats AS (
      SELECT r.driverId,
             COUNT(*) AS pole_starts,
             SUM(CASE WHEN r.position = '1' THEN 1 ELSE 0 END) AS wins_from_pole
      FROM results AS r
      WHERE r.grid = 1
      GROUP BY r.driverId
    )
    SELECT d.driverId, d.forename, d.surname,
           p.wins_from_pole, p.pole_starts,
           ROUND(100.0 * p.wins_from_pole / p.pole_starts, 1) AS conversion_pct
    FROM pole_stats AS p
    JOIN drivers AS d ON d.driverId = p.driverId
    WHERE p.pole_starts >= 10
    ORDER BY 1.0 * p.wins_from_pole / p.pole_starts DESC,
             p.wins_from_pole DESC,
             d.driverId
    LIMIT 3
- name: advanced_003
  question: How did the annual retirement rate change from 2008 through 2017, defining a retirement as a result whose positionText
    is 'R'? Report each year's rate, identify the highest and lowest years, and say whether the period shows a sustained decline.
  reference_answer: 'The retirement rates were 21.7% in 2008, 17.1% in 2009, 22.6% in 2010, 16.2% in 2011, 15.4% in 2012,
    11.5% in 2013, 18.4% in 2014, 17.7% in 2015, 16.0% in 2016, and 21.3% in 2017. The highest rate was 22.6% in 2010 and
    the lowest was 11.5% in 2013. There was no sustained decline: the rate fell through 2013 but later rose, ending near its
    2008 level.'
  gold_sql: |-
    SELECT ra.year,
           COUNT(*) AS entries,
           SUM(CASE WHEN r.positionText = 'R' THEN 1 ELSE 0 END) AS retirements,
           ROUND(100.0 * SUM(CASE WHEN r.positionText = 'R' THEN 1 ELSE 0 END) / COUNT(*), 1)
             AS retirement_pct
    FROM results AS r
    JOIN races AS ra ON ra.raceId = r.raceId
    WHERE ra.year BETWEEN 2008 AND 2017
    GROUP BY ra.year
    ORDER BY ra.year
- name: advanced_004
  question: Between 2013 and 2017, which three drivers gained the most positions on average from the starting grid to the
    final positionOrder? Exclude pit-lane starts where grid is 0 and require at least 40 starts. Define positions gained as
    grid minus positionOrder.
  reference_answer: Marcus Ericsson gained the most positions on average at 1.88 across 76 starts. Sergio P̩rez was second
    at 0.94 across 98 starts, followed by Kevin Magnussen at 0.84 across 61 starts.
  gold_sql: |-
    SELECT d.driverId, d.forename, d.surname,
           COUNT(*) AS starts,
           ROUND(AVG(r.grid - r.positionOrder), 2) AS avg_positions_gained
    FROM results AS r
    JOIN races AS ra ON ra.raceId = r.raceId
    JOIN drivers AS d ON d.driverId = r.driverId
    WHERE ra.year BETWEEN 2013 AND 2017
      AND r.grid > 0
      AND r.positionOrder IS NOT NULL
    GROUP BY d.driverId, d.forename, d.surname
    HAVING COUNT(*) >= 40
    ORDER BY AVG(r.grid - r.positionOrder) DESC, starts DESC, d.driverId
    LIMIT 3
- name: advanced_005
  question: For each season from 2008 through 2017, what percentage of all constructor points was scored by that season's
    highest-scoring constructor? Identify the most and least concentrated seasons and compare 2017 with 2008.
  reference_answer: The leading-constructor shares were Ferrari 24.5% in 2008; Brawn 26.7% in 2009; Red Bull 26.0% in 2010,
    33.9% in 2011, 22.8% in 2012, and 31.1% in 2013; and Mercedes 34.6% in 2014, 36.6% in 2015, 36.1% in 2016, and 33.1% in
    2017. Concentration was highest in 2015 at 36.6% and lowest in 2012 at 22.8%. The 2017 share was 8.6 percentage points
    above 2008, although the path was not consistently upward.
  gold_sql: |-
    WITH constructor_year AS (
      SELECT ra.year, cr.constructorId, SUM(COALESCE(cr.points, 0.0)) AS points
      FROM constructorResults AS cr
      JOIN races AS ra ON ra.raceId = cr.raceId
      WHERE ra.year BETWEEN 2008 AND 2017
      GROUP BY ra.year, cr.constructorId
    ), ranked AS (
      SELECT year, constructorId, points,
             SUM(points) OVER (PARTITION BY year) AS total_points,
             ROW_NUMBER() OVER (PARTITION BY year ORDER BY points DESC, constructorId) AS rank
      FROM constructor_year
    )
    SELECT r.year, c.name AS top_constructor, r.points AS top_points,
           ROUND(100.0 * r.points / r.total_points, 1) AS points_share_pct
    FROM ranked AS r
    JOIN constructors AS c ON c.constructorId = r.constructorId
    WHERE r.rank = 1
    ORDER BY r.year
- name: advanced_006
  question: Which three drivers most outperformed their usual finishing position at the Monaco Grand Prix from 2008 through
    2017? Require at least 5 Monaco starts and 30 starts at other races, and define Monaco advantage as average positionOrder
    elsewhere minus average positionOrder at Monaco.
  reference_answer: 'Mark Webber had the largest Monaco advantage: an average finish of 3.00 in 6 Monaco starts versus 7.23
    across 106 other starts, an advantage of 4.23 positions. Adrian Sutil was second at 3.13 positions, averaging 11.17 at
    Monaco and 14.30 elsewhere. Daniel Ricciardo was third at 1.80, averaging 8.00 at Monaco and 9.80 elsewhere.'
  gold_sql: |-
    WITH driver_splits AS (
      SELECT r.driverId,
             SUM(CASE WHEN ra.name = 'Monaco Grand Prix' THEN 1 ELSE 0 END) AS monaco_starts,
             AVG(CASE WHEN ra.name = 'Monaco Grand Prix' THEN r.positionOrder END)
               AS monaco_avg_finish,
             SUM(CASE WHEN ra.name <> 'Monaco Grand Prix' THEN 1 ELSE 0 END) AS other_starts,
             AVG(CASE WHEN ra.name <> 'Monaco Grand Prix' THEN r.positionOrder END)
               AS other_avg_finish
      FROM results AS r
      JOIN races AS ra ON ra.raceId = r.raceId
      WHERE ra.year BETWEEN 2008 AND 2017
      GROUP BY r.driverId
    )
    SELECT d.driverId, d.forename, d.surname,
           s.monaco_starts, ROUND(s.monaco_avg_finish, 2) AS monaco_avg_finish,
           s.other_starts, ROUND(s.other_avg_finish, 2) AS other_avg_finish,
           ROUND(s.other_avg_finish - s.monaco_avg_finish, 2) AS monaco_advantage
    FROM driver_splits AS s
    JOIN drivers AS d ON d.driverId = s.driverId
    WHERE s.monaco_starts >= 5 AND s.other_starts >= 30
    ORDER BY s.other_avg_finish - s.monaco_avg_finish DESC,
             s.monaco_avg_finish,
             d.driverId
    LIMIT 3
- name: advanced_007
  question: Which three constructors were most dependent on their top-scoring driver for points in 2017? Consider only constructors
    that scored points, and report the driver, their points, the team total, and their share of the total.
  reference_answer: 'Sauber was most dependent on one driver: Pascal Wehrlein scored all 5 of its points, or 100.0%. Toro
    Rosso was next, with Carlos Sainz scoring 48 of 53 points, or 90.6%. Renault was third, with Nico H�_lkenberg scoring
    43 of 57 points, or 75.4%. These ratios measure concentration, not team quality; Sauber''s 100% came from a total of only
    5 points.'
  gold_sql: |-
    WITH driver_points AS (
      SELECT r.constructorId, r.driverId, SUM(COALESCE(r.points, 0.0)) AS points
      FROM results AS r
      JOIN races AS ra ON ra.raceId = r.raceId
      WHERE ra.year = 2017
      GROUP BY r.constructorId, r.driverId
    ), ranked AS (
      SELECT constructorId, driverId, points,
             SUM(points) OVER (PARTITION BY constructorId) AS team_points,
             ROW_NUMBER() OVER (PARTITION BY constructorId ORDER BY points DESC, driverId) AS rank
      FROM driver_points
    )
    SELECT c.name AS constructor, d.driverId, d.forename, d.surname,
           r.points AS driver_points, r.team_points,
           ROUND(100.0 * r.points / r.team_points, 1) AS top_driver_share_pct
    FROM ranked AS r
    JOIN constructors AS c ON c.constructorId = r.constructorId
    JOIN drivers AS d ON d.driverId = r.driverId
    WHERE r.rank = 1 AND r.team_points > 0
    ORDER BY 1.0 * r.points / r.team_points DESC, c.name
    LIMIT 3
- name: advanced_008
  question: 'Using historical performance as a proxy, which constructor is the strongest growth-investment candidate under
    this rule: it entered at least 15 races in both 2015 and 2017, had above-median points per race among eligible teams in
    2017, improved since 2015, and had the largest increase? Report the candidate and all other teams that passed the screen.'
  reference_answer: Red Bull is the strongest candidate under this proxy. Its points per race rose from 9.842 across 19 races
    in 2015 to 18.400 across 20 races in 2017, an increase of 8.558. The eligible-team median in 2017 was 6.750. The other
    teams passing the screen were Ferrari, up 3.574 from 22.526 to 26.100, and Force India, up 2.192 from 7.158 to 9.350.
    This is a historical performance screen, not a forecast or a financial valuation.
  gold_sql: |-
    WITH team_year AS (
      SELECT cr.constructorId, ra.year,
             COUNT(DISTINCT cr.raceId) AS races,
             SUM(COALESCE(cr.points, 0.0)) AS points,
             1.0 * SUM(COALESCE(cr.points, 0.0)) / COUNT(DISTINCT cr.raceId) AS points_per_race
      FROM constructorResults AS cr
      JOIN races AS ra ON ra.raceId = cr.raceId
      WHERE ra.year IN (2015, 2017)
      GROUP BY cr.constructorId, ra.year
    ), paired AS (
      SELECT y15.constructorId,
             y15.races AS races_2015, y15.points_per_race AS points_per_race_2015,
             y17.races AS races_2017, y17.points_per_race AS points_per_race_2017,
             y17.points_per_race - y15.points_per_race AS improvement
      FROM team_year AS y15
      JOIN team_year AS y17 ON y17.constructorId = y15.constructorId
      WHERE y15.year = 2015 AND y17.year = 2017
        AND y15.races >= 15 AND y17.races >= 15
    ), ordered_2017 AS (
      SELECT points_per_race_2017,
             ROW_NUMBER() OVER (ORDER BY points_per_race_2017) AS row_number,
             COUNT(*) OVER () AS team_count
      FROM paired
    ), median AS (
      SELECT AVG(points_per_race_2017) AS median_points_per_race_2017
      FROM ordered_2017
      WHERE row_number IN ((team_count + 1) / 2, (team_count + 2) / 2)
    )
    SELECT c.name,
           p.races_2015, ROUND(p.points_per_race_2015, 3) AS points_per_race_2015,
           p.races_2017, ROUND(p.points_per_race_2017, 3) AS points_per_race_2017,
           ROUND(p.improvement, 3) AS improvement,
           ROUND(m.median_points_per_race_2017, 3) AS median_points_per_race_2017
    FROM paired AS p
    JOIN constructors AS c ON c.constructorId = p.constructorId
    CROSS JOIN median AS m
    WHERE p.points_per_race_2017 > m.median_points_per_race_2017
      AND p.improvement > 0
    ORDER BY p.improvement DESC, p.points_per_race_2017 DESC, p.constructorId
- name: advanced_009
  question: 'Across 2008-2017, which five seasons had the largest gap between the leading driver''s points and the median driver''s points? Report the leading driver, leader points, median driver points, and gap.'
  reference_answer: 'The results were: year: 2011, leading driver: Sebastian Vettel, leader points: 392.0, median points: 20.5, gap: 371.5; year: 2013, leading driver: Sebastian Vettel, leader points: 397.0, median points: 48.0, gap: 349.0; year: 2016, leading driver: Nico Rosberg, leader points: 385.0, median points: 37.5, gap: 347.5; year: 2014, leading driver: Lewis Hamilton, leader points: 384.0, median points: 38.5, gap: 345.5; year: 2017, leading driver: Lewis Hamilton, leader points: 363.0, median points: 28.0, gap: 335.0.'
  gold_sql: |-
    WITH driver_points AS (
      SELECT r.year, res.driverId, SUM(res.points) AS points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year BETWEEN 2008 AND 2017
      GROUP BY r.year, res.driverId
    ), ranked AS (
      SELECT dp.*,
             ROW_NUMBER() OVER (PARTITION BY year ORDER BY points) AS rn,
             COUNT(*) OVER (PARTITION BY year) AS driver_count,
             MAX(points) OVER (PARTITION BY year) AS leader_points,
             FIRST_VALUE(driverId) OVER (PARTITION BY year ORDER BY points DESC, driverId) AS leader_id
      FROM driver_points AS dp
    ), season_stats AS (
      SELECT year, leader_id, leader_points,
             AVG(CASE WHEN rn IN ((driver_count + 1) / 2, (driver_count + 2) / 2) THEN points END) AS median_points
      FROM ranked
      GROUP BY year, leader_id, leader_points
    )
    SELECT s.year, d.forename || ' ' || d.surname AS leading_driver,
           ROUND(s.leader_points, 3) AS leader_points,
           ROUND(s.median_points, 3) AS median_points,
           ROUND(s.leader_points - s.median_points, 3) AS leader_median_gap
    FROM season_stats AS s
    JOIN drivers AS d ON d.driverId = s.leader_id
    ORDER BY leader_median_gap DESC, s.year
    LIMIT 5
- name: advanced_010
  question: 'Which five drivers improved their average finishing position the most between the first and second halves of their careers? Consider drivers with at least 80 starts and at least 20 starts in each half; report both averages, the counts, and the improvement.'
  reference_answer: 'The results were: driver: Aguri Suzuki, starts: 88, early starts: 44, late starts: 44, early average finish: 24.5, late average finish: 16.82, improvement: 7.68; driver: Mark Webber, starts: 217, early starts: 108, late starts: 109, early average finish: 12.69, late average finish: 6.91, improvement: 5.79; driver: Daniel Ricciardo, starts: 129, early starts: 64, late starts: 65, early average finish: 12.38, late average finish: 7.11, improvement: 5.27; driver: Mika H�_kkinen, starts: 165, early starts: 82, late starts: 83, early average finish: 12.28, late average finish: 7.52, improvement: 4.76; driver: Nico Rosberg, starts: 206, early starts: 103, late starts: 103, early average finish: 10.5, late average finish: 6.01, improvement: 4.49.'
  gold_sql: |-
    WITH career AS (
      SELECT res.driverId, res.positionOrder,
             ROW_NUMBER() OVER (PARTITION BY res.driverId ORDER BY r.date, r.raceId, res.resultId) AS career_start,
             COUNT(*) OVER (PARTITION BY res.driverId) AS career_starts
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
    ), stats AS (
      SELECT driverId,
             COUNT(*) AS starts,
             SUM(CASE WHEN career_start <= career_starts / 2 THEN 1 ELSE 0 END) AS early_starts,
             SUM(CASE WHEN career_start > career_starts / 2 THEN 1 ELSE 0 END) AS late_starts,
             AVG(CASE WHEN career_start <= career_starts / 2 THEN positionOrder END) AS early_avg_finish,
             AVG(CASE WHEN career_start > career_starts / 2 THEN positionOrder END) AS late_avg_finish
      FROM career
      GROUP BY driverId
      HAVING COUNT(*) >= 80
         AND SUM(CASE WHEN career_start <= career_starts / 2 THEN 1 ELSE 0 END) >= 20
         AND SUM(CASE WHEN career_start > career_starts / 2 THEN 1 ELSE 0 END) >= 20
    )
    SELECT d.forename || ' ' || d.surname AS driver,
           starts, early_starts, late_starts,
           ROUND(early_avg_finish, 2) AS early_avg_finish,
           ROUND(late_avg_finish, 2) AS late_avg_finish,
           ROUND(early_avg_finish - late_avg_finish, 2) AS improvement
    FROM stats AS s
    JOIN drivers AS d ON d.driverId = s.driverId
    ORDER BY improvement DESC, starts DESC
    LIMIT 5
- name: advanced_011
  question: 'Which five constructors improved their average finishing position the most from 2010-2013 to 2014-2017? Require at least 100 results in each period; report both counts, both averages, and the improvement.'
  reference_answer: 'The results were: constructor: Mercedes, early entries: 154, late entries: 158, early average finish: 9.75, late average finish: 3.51, improvement: 6.23; constructor: Williams, early entries: 154, late entries: 158, early average finish: 14.08, late average finish: 9.63, improvement: 4.45; constructor: Force India, early entries: 154, late entries: 158, early average finish: 12.16, late average finish: 9.69, improvement: 2.47; constructor: Toro Rosso, early entries: 154, late entries: 158, early average finish: 13.71, late average finish: 12.87, improvement: 0.83; constructor: Ferrari, early entries: 154, late entries: 158, early average finish: 6.72, late average finish: 6.84, improvement: -0.12.'
  gold_sql: |-
    SELECT c.name AS constructor,
           COUNT(CASE WHEN r.year BETWEEN 2010 AND 2013 THEN 1 END) AS early_entries,
           COUNT(CASE WHEN r.year BETWEEN 2014 AND 2017 THEN 1 END) AS late_entries,
           ROUND(AVG(CASE WHEN r.year BETWEEN 2010 AND 2013 THEN res.positionOrder END), 2) AS early_avg_finish,
           ROUND(AVG(CASE WHEN r.year BETWEEN 2014 AND 2017 THEN res.positionOrder END), 2) AS late_avg_finish,
           ROUND(
             AVG(CASE WHEN r.year BETWEEN 2010 AND 2013 THEN res.positionOrder END) -
             AVG(CASE WHEN r.year BETWEEN 2014 AND 2017 THEN res.positionOrder END), 2
           ) AS improvement
    FROM results AS res
    JOIN races AS r ON r.raceId = res.raceId
    JOIN constructors AS c ON c.constructorId = res.constructorId
    WHERE r.year BETWEEN 2010 AND 2017
    GROUP BY res.constructorId, c.name
    HAVING early_entries >= 100 AND late_entries >= 100
    ORDER BY improvement DESC, late_entries DESC
    LIMIT 5
- name: advanced_012
  question: 'Which five seasons from 2008-2017 concentrated the largest share of driver points in the top three? Report the leading driver, total points, top-three points, and the top-three share.'
  reference_answer: 'The results were: year: 2015, leading driver: Lewis Hamilton, total points: 1919.0, top-three points: 981.0, top-three share: 51.12; year: 2017, leading driver: Lewis Hamilton, total points: 2020.0, top-three points: 985.0, top-three share: 48.76; year: 2016, leading driver: Nico Rosberg, total points: 2121.0, top-three points: 1021.0, top-three share: 48.14; year: 2011, leading driver: Sebastian Vettel, total points: 1919.0, top-three points: 920.0, top-three share: 47.94; year: 2014, leading driver: Lewis Hamilton, total points: 2020.0, top-three points: 939.0, top-three share: 46.49.'
  gold_sql: |-
    WITH driver_points AS (
      SELECT r.year, res.driverId, SUM(res.points) AS points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year BETWEEN 2008 AND 2017
      GROUP BY r.year, res.driverId
    ), ranked AS (
      SELECT year, driverId, points,
             ROW_NUMBER() OVER (PARTITION BY year ORDER BY points DESC, driverId) AS position
      FROM driver_points
    ), season_totals AS (
      SELECT year,
             SUM(points) AS total_points,
             SUM(CASE WHEN position <= 3 THEN points ELSE 0 END) AS top_three_points,
             MAX(CASE WHEN position = 1 THEN driverId END) AS leader_id
      FROM ranked
      GROUP BY year
    )
    SELECT s.year, d.forename || ' ' || d.surname AS leading_driver,
           ROUND(s.total_points, 3) AS total_points,
           ROUND(s.top_three_points, 3) AS top_three_points,
           ROUND(100.0 * s.top_three_points / s.total_points, 2) AS top_three_share
    FROM season_totals AS s
    JOIN drivers AS d ON d.driverId = s.leader_id
    ORDER BY top_three_share DESC, s.year
    LIMIT 5
- name: advanced_013
  question: 'Among drivers with at least 30 qualifying-result pairs from 2014-2017, which five gained the most positions from qualifying to finish? Report starts, both average positions, and average positions gained.'
  reference_answer: 'The results were: driver: Felipe Nasr, starts: 40, average qualifying position: 16.85, average finish position: 14.15, average positions gained: 2.7; driver: Marcus Ericsson, starts: 75, average qualifying position: 17.93, average finish position: 15.37, average positions gained: 2.56; driver: Pascal Wehrlein, starts: 39, average qualifying position: 18.28, average finish position: 16.13, average positions gained: 2.15; driver: Sergio P̩rez, starts: 79, average qualifying position: 10.34, average finish position: 9.24, average positions gained: 1.1; driver: Kevin Magnussen, starts: 60, average qualifying position: 13.63, average finish position: 12.68, average positions gained: 0.95.'
  gold_sql: |-
    SELECT d.forename || ' ' || d.surname AS driver,
           COUNT(*) AS starts,
           ROUND(AVG(q.position), 2) AS avg_qualifying_position,
           ROUND(AVG(res.positionOrder), 2) AS avg_finish_position,
           ROUND(AVG(q.position - res.positionOrder), 2) AS avg_positions_gained
    FROM qualifying AS q
    JOIN results AS res ON res.raceId = q.raceId AND res.driverId = q.driverId
    JOIN races AS r ON r.raceId = res.raceId
    JOIN drivers AS d ON d.driverId = res.driverId
    WHERE r.year BETWEEN 2014 AND 2017
      AND q.position > 0
    GROUP BY res.driverId, d.forename, d.surname
    HAVING COUNT(*) >= 30
    ORDER BY avg_positions_gained DESC, starts DESC
    LIMIT 5
- name: advanced_014
  question: 'Across 2010-2017, which five circuits had the largest gap between the best and worst constructor points per race? Only consider constructors with at least three entries at a circuit and circuits with at least five such constructors; report both constructors, both rates, and the gap.'
  reference_answer: 'The results were: circuit: Red Bull Ring, top constructor: Mercedes, top points per race: 40.0, bottom constructor: Sauber, bottom points per race: 0.0, spread: 40.0; circuit: Sochi Autodrom, top constructor: Mercedes, top points per race: 37.0, bottom constructor: Toro Rosso, bottom points per race: 0.5, spread: 36.5; circuit: Aut_dromo Hermanos Rodr_guez, top constructor: Mercedes, top points per race: 35.33, bottom constructor: Sauber, bottom points per race: 0.0, spread: 35.33; circuit: Buddh International Circuit, top constructor: Red Bull, top points per race: 34.0, bottom constructor: Williams, bottom points per race: 0.33, spread: 33.67; circuit: Sepang International Circuit, top constructor: Red Bull, top points per race: 29.5, bottom constructor: HRT, bottom points per race: 0.0, spread: 29.5.'
  gold_sql: |-
    WITH team_circuit AS (
      SELECT r.circuitId, cr.constructorId,
             SUM(cr.points) AS points,
             COUNT(DISTINCT cr.raceId) AS races,
             SUM(cr.points) / COUNT(DISTINCT cr.raceId) AS points_per_race
      FROM constructorResults AS cr
      JOIN races AS r ON r.raceId = cr.raceId
      WHERE r.year BETWEEN 2010 AND 2017
      GROUP BY r.circuitId, cr.constructorId
      HAVING COUNT(DISTINCT cr.raceId) >= 3
    ), ranked AS (
      SELECT tc.*,
             COUNT(*) OVER (PARTITION BY circuitId) AS constructor_count,
             FIRST_VALUE(constructorId) OVER (PARTITION BY circuitId ORDER BY points_per_race DESC, constructorId) AS top_constructor_id,
             FIRST_VALUE(points_per_race) OVER (PARTITION BY circuitId ORDER BY points_per_race DESC, constructorId) AS top_points_per_race,
             FIRST_VALUE(constructorId) OVER (PARTITION BY circuitId ORDER BY points_per_race, constructorId) AS bottom_constructor_id,
             FIRST_VALUE(points_per_race) OVER (PARTITION BY circuitId ORDER BY points_per_race, constructorId) AS bottom_points_per_race
      FROM team_circuit AS tc
    ), circuit_stats AS (
      SELECT DISTINCT circuitId, constructor_count, top_constructor_id, top_points_per_race,
             bottom_constructor_id, bottom_points_per_race,
             top_points_per_race - bottom_points_per_race AS spread
      FROM ranked
      WHERE constructor_count >= 5
    )
    SELECT ci.name AS circuit,
           top.name AS top_constructor,
           ROUND(cs.top_points_per_race, 2) AS top_points_per_race,
           bottom.name AS bottom_constructor,
           ROUND(cs.bottom_points_per_race, 2) AS bottom_points_per_race,
           ROUND(cs.spread, 2) AS spread
    FROM circuit_stats AS cs
    JOIN circuits AS ci ON ci.circuitId = cs.circuitId
    JOIN constructors AS top ON top.constructorId = cs.top_constructor_id
    JOIN constructors AS bottom ON bottom.constructorId = cs.bottom_constructor_id
    ORDER BY spread DESC, circuit
    LIMIT 5
- name: advanced_015
  question: 'Which five drivers improved their points per race the most in 2014-2017 relative to their career average? Require at least 20 recent races and 50 career races; report both rates and the change.'
  reference_answer: 'The results were: driver: Nico Rosberg, recent races: 59, career races: 206, recent points per race: 17.356, career points per race: 7.74, improvement: 9.616; driver: Lewis Hamilton, recent races: 79, career races: 208, recent points per race: 19.089, career points per race: 12.548, improvement: 6.541; driver: Daniel Ricciardo, recent races: 79, career races: 129, recent points per race: 9.949, career points per race: 6.326, improvement: 3.624; driver: Kimi R�_ikk̦nen, recent races: 79, career races: 273, recent points per race: 7.544, career points per race: 5.733, improvement: 1.812; driver: Valtteri Bottas, recent races: 79, career races: 98, recent points per race: 9.013, career points per race: 7.306, improvement: 1.707.'
  gold_sql: |-
    WITH career AS (
      SELECT res.driverId,
             COUNT(DISTINCT res.raceId) AS career_races,
             SUM(res.points) AS career_points
      FROM results AS res
      GROUP BY res.driverId
    ), recent AS (
      SELECT res.driverId,
             COUNT(DISTINCT res.raceId) AS recent_races,
             SUM(res.points) AS recent_points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year BETWEEN 2014 AND 2017
      GROUP BY res.driverId
    )
    SELECT d.forename || ' ' || d.surname AS driver,
           recent_races, career_races,
           ROUND(recent_points / recent_races, 3) AS recent_points_per_race,
           ROUND(career_points / career_races, 3) AS career_points_per_race,
           ROUND(recent_points / recent_races - career_points / career_races, 3) AS improvement
    FROM recent
    JOIN career ON career.driverId = recent.driverId
    JOIN drivers AS d ON d.driverId = recent.driverId
    WHERE recent_races >= 20 AND career_races >= 50
    ORDER BY improvement DESC, recent_races DESC
    LIMIT 5
- name: advanced_016
  question: 'Which five constructors increased their share of all constructor points the most from 2014 to 2017? Require at least 15 constructor-result races in both seasons; report both shares and the change.'
  reference_answer: 'The results were: constructor: Ferrari, 2014 races: 19, 2017 races: 20, 2014 share: 10.66, 2017 share: 25.84, share change: 15.18; constructor: Force India, 2014 races: 19, 2017 races: 20, 2014 share: 7.65, 2017 share: 9.26, share change: 1.61; constructor: Toro Rosso, 2014 races: 19, 2017 races: 20, 2014 share: 1.48, 2017 share: 2.62, share change: 1.14; constructor: Sauber, 2014 races: 19, 2017 races: 20, 2014 share: 0.0, 2017 share: 0.25, share change: 0.25; constructor: Mercedes, 2014 races: 19, 2017 races: 20, 2014 share: 34.6, 2017 share: 33.07, share change: -1.53.'
  gold_sql: |-
    WITH yearly AS (
      SELECT cr.constructorId, r.year, SUM(cr.points) AS points,
             COUNT(DISTINCT cr.raceId) AS races
      FROM constructorResults AS cr
      JOIN races AS r ON r.raceId = cr.raceId
      WHERE r.year IN (2014, 2017)
      GROUP BY cr.constructorId, r.year
    ), totals AS (
      SELECT year, SUM(points) AS season_points
      FROM yearly
      GROUP BY year
    ), paired AS (
      SELECT y14.constructorId,
             y14.races AS races_2014, y17.races AS races_2017,
             y14.points * 100.0 / t14.season_points AS share_2014,
             y17.points * 100.0 / t17.season_points AS share_2017
      FROM yearly AS y14
      JOIN yearly AS y17 ON y17.constructorId = y14.constructorId AND y17.year = 2017
      JOIN totals AS t14 ON t14.year = 2014
      JOIN totals AS t17 ON t17.year = 2017
      WHERE y14.year = 2014 AND y14.races >= 15 AND y17.races >= 15
    )
    SELECT c.name AS constructor, races_2014, races_2017,
           ROUND(share_2014, 2) AS share_2014,
           ROUND(share_2017, 2) AS share_2017,
           ROUND(share_2017 - share_2014, 2) AS share_change
    FROM paired AS p
    JOIN constructors AS c ON c.constructorId = p.constructorId
    ORDER BY share_change DESC, constructor
    LIMIT 5
- name: advanced_017
  question: 'Which five seasons from 2008-2017 had the highest percentage of races won from pole? Report races, pole wins, and the pole-win rate.'
  reference_answer: 'The results were: year: 2015, races: 19, pole wins: 12, pole-win rate: 63.16; year: 2016, races: 21, pole wins: 13, pole-win rate: 61.9; year: 2017, races: 20, pole wins: 11, pole-win rate: 55.0; year: 2009, races: 17, pole wins: 9, pole-win rate: 52.94; year: 2013, races: 19, pole wins: 10, pole-win rate: 52.63.'
  gold_sql: |-
    WITH race_outcomes AS (
      SELECT r.raceId, r.year,
             MAX(CASE WHEN q.position = 1 AND res.position = '1' THEN 1 ELSE 0 END) AS pole_win
      FROM races AS r
      JOIN results AS res ON res.raceId = r.raceId
      LEFT JOIN qualifying AS q ON q.raceId = res.raceId AND q.driverId = res.driverId
      WHERE r.year BETWEEN 2008 AND 2017
      GROUP BY r.raceId, r.year
    ), season_stats AS (
      SELECT year, COUNT(*) AS races,
             SUM(pole_win) AS pole_wins,
             ROUND(100.0 * SUM(pole_win) / COUNT(*), 2) AS pole_win_rate
      FROM race_outcomes
      GROUP BY year
    )
    SELECT year, races, pole_wins, pole_win_rate
    FROM season_stats
    ORDER BY pole_win_rate DESC, year
    LIMIT 5
- name: advanced_018
  question: 'Among drivers with at least 50 starts and positive points from 2010-2017, which five had the highest top-five finish rate? Report starts, top-five finishes and rate, total points, and the share of points from top-five finishes.'
  reference_answer: 'The results were: driver: Sebastian Vettel, starts: 156, top-five finishes: 123, top-five rate: 78.85, points: 2300.0, top-five points: 2214.0, top-five point share: 96.26; driver: Lewis Hamilton, starts: 156, top-five finishes: 118, top-five rate: 75.64, points: 2354.0, top-five points: 2267.0, top-five point share: 96.3; driver: Mark Webber, starts: 77, top-five finishes: 51, top-five rate: 66.23, points: 878.0, top-five points: 804.0, top-five point share: 91.57; driver: Nico Rosberg, starts: 136, top-five finishes: 75, top-five rate: 55.15, points: 1519.0, top-five points: 1343.0, top-five point share: 88.41; driver: Kimi R�_ikk̦nen, starts: 116, top-five finishes: 58, top-five rate: 50.0, points: 986.0, top-five points: 815.0, top-five point share: 82.66.'
  gold_sql: |-
    SELECT d.forename || ' ' || d.surname AS driver,
           COUNT(*) AS starts,
           SUM(CASE WHEN res.positionOrder <= 5 THEN 1 ELSE 0 END) AS top_five_finishes,
           ROUND(100.0 * SUM(CASE WHEN res.positionOrder <= 5 THEN 1 ELSE 0 END) / COUNT(*), 2) AS top_five_rate,
           ROUND(SUM(res.points), 3) AS points,
           ROUND(SUM(CASE WHEN res.positionOrder <= 5 THEN res.points ELSE 0 END), 3) AS top_five_points,
           ROUND(100.0 * SUM(CASE WHEN res.positionOrder <= 5 THEN res.points ELSE 0 END) / SUM(res.points), 2) AS top_five_point_share
    FROM results AS res
    JOIN races AS r ON r.raceId = res.raceId
    JOIN drivers AS d ON d.driverId = res.driverId
    WHERE r.year BETWEEN 2010 AND 2017
    GROUP BY res.driverId, d.forename, d.surname
    HAVING COUNT(*) >= 50 AND SUM(res.points) > 0
    ORDER BY top_five_rate DESC, starts DESC
    LIMIT 5
- name: advanced_019
  question: 'Which five constructors had the most unequal distribution of 2017 points among their scoring drivers? Require at least two scoring drivers; report the top and bottom driver shares and the spread.'
  reference_answer: 'The results were: constructor: Toro Rosso, top driver: Carlos Sainz, top share: 90.57, bottom driver: Daniil Kvyat, bottom share: 9.43, share spread: 81.13; constructor: Renault, top driver: Nico H�_lkenberg, top share: 75.44, bottom driver: Carlos Sainz, bottom share: 10.53, share spread: 64.91; constructor: Ferrari, top driver: Sebastian Vettel, top share: 60.73, bottom driver: Kimi R�_ikk̦nen, bottom share: 39.27, share spread: 21.46; constructor: Haas F1 Team, top driver: Romain Grosjean, top share: 59.57, bottom driver: Kevin Magnussen, bottom share: 40.43, share spread: 19.15; constructor: McLaren, top driver: Fernando Alonso, top share: 56.67, bottom driver: Stoffel Vandoorne, bottom share: 43.33, share spread: 13.33.'
  gold_sql: |-
    WITH driver_points AS (
      SELECT res.constructorId, res.driverId, SUM(res.points) AS points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year = 2017
      GROUP BY res.constructorId, res.driverId
    ), scored AS (
      SELECT dp.*, SUM(points) OVER (PARTITION BY constructorId) AS team_points
      FROM driver_points AS dp
      WHERE points > 0
    ), shares AS (
      SELECT scored.*, points * 100.0 / team_points AS share
      FROM scored
    ), ranked AS (
      SELECT shares.*,
             COUNT(*) OVER (PARTITION BY constructorId) AS scoring_drivers,
             FIRST_VALUE(driverId) OVER (PARTITION BY constructorId ORDER BY share DESC, driverId) AS top_driver_id,
             FIRST_VALUE(share) OVER (PARTITION BY constructorId ORDER BY share DESC, driverId) AS top_share,
             FIRST_VALUE(driverId) OVER (PARTITION BY constructorId ORDER BY share, driverId) AS bottom_driver_id,
             FIRST_VALUE(share) OVER (PARTITION BY constructorId ORDER BY share, driverId) AS bottom_share
      FROM shares
    )
    SELECT DISTINCT c.name AS constructor,
           top.forename || ' ' || top.surname AS top_driver,
           ROUND(r.top_share, 2) AS top_share,
           bottom.forename || ' ' || bottom.surname AS bottom_driver,
           ROUND(r.bottom_share, 2) AS bottom_share,
           ROUND(r.top_share - r.bottom_share, 2) AS share_spread
    FROM ranked AS r
    JOIN constructors AS c ON c.constructorId = r.constructorId
    JOIN drivers AS top ON top.driverId = r.top_driver_id
    JOIN drivers AS bottom ON bottom.driverId = r.bottom_driver_id
    WHERE r.scoring_drivers >= 2
    ORDER BY share_spread DESC, constructor
    LIMIT 5
- name: advanced_020
  question: 'Which five circuits had the most diverse race winners from 2008-2017? Require at least five races at a circuit; report races, unique winners, and winner diversity.'
  reference_answer: 'The results were: circuit: Circuit de Barcelona-Catalunya, races: 10, unique winners: 9, winner diversity: 90.0; circuit: Valencia Street Circuit, races: 5, unique winners: 4, winner diversity: 80.0; circuit: Sepang International Circuit, races: 10, unique winners: 7, winner diversity: 70.0; circuit: Circuit de Spa-Francorchamps, races: 10, unique winners: 7, winner diversity: 70.0; circuit: Bahrain International Circuit, races: 9, unique winners: 6, winner diversity: 66.67.'
  gold_sql: |-
    WITH winners AS (
      SELECT r.circuitId, r.raceId, res.driverId
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year BETWEEN 2008 AND 2017 AND res.position = '1'
    ), circuit_stats AS (
      SELECT circuitId, COUNT(*) AS races, COUNT(DISTINCT driverId) AS winners
      FROM winners
      GROUP BY circuitId
      HAVING COUNT(*) >= 5
    )
    SELECT c.name AS circuit, races, winners,
           ROUND(100.0 * winners / races, 2) AS winner_diversity_pct
    FROM circuit_stats AS s
    JOIN circuits AS c ON c.circuitId = s.circuitId
    ORDER BY winner_diversity_pct DESC, races DESC
    LIMIT 5
- name: advanced_021
  question: 'Among drivers with at least 30 starts from outside the top ten between 2010 and 2017, which five converted those difficult starts into top-five finishes most often? Report starts, top-five finishes, recovery rate, and average finish.'
  reference_answer: 'The results were: driver: Jenson Button, outside top-ten starts: 58, top-five finishes: 5, recovery rate: 8.62, average starting grid: 14.41, average finish: 12.4; driver: Fernando Alonso, outside top-ten starts: 47, top-five finishes: 4, recovery rate: 8.51, average starting grid: 15.38, average finish: 13.17; driver: Daniel Ricciardo, outside top-ten starts: 48, top-five finishes: 4, recovery rate: 8.33, average starting grid: 16.92, average finish: 13.63; driver: Felipe Massa, outside top-ten starts: 38, top-five finishes: 3, recovery rate: 7.89, average starting grid: 14.58, average finish: 11.05; driver: Nico H�_lkenberg, outside top-ten starts: 63, top-five finishes: 4, recovery rate: 6.35, average starting grid: 13.24, average finish: 12.86.'
  gold_sql: |-
    SELECT d.forename || ' ' || d.surname AS driver,
           COUNT(*) AS outside_top_ten_starts,
           SUM(CASE WHEN res.positionOrder <= 5 THEN 1 ELSE 0 END) AS top_five_finishes,
           ROUND(100.0 * SUM(CASE WHEN res.positionOrder <= 5 THEN 1 ELSE 0 END) / COUNT(*), 2) AS recovery_rate,
           ROUND(AVG(res.grid), 2) AS avg_starting_grid,
           ROUND(AVG(res.positionOrder), 2) AS avg_finish_position
    FROM results AS res
    JOIN races AS r ON r.raceId = res.raceId
    JOIN drivers AS d ON d.driverId = res.driverId
    WHERE r.year BETWEEN 2010 AND 2017 AND res.grid > 10
    GROUP BY res.driverId, d.forename, d.surname
    HAVING COUNT(*) >= 30
    ORDER BY recovery_rate DESC, top_five_finishes DESC
    LIMIT 5
- name: advanced_022
  question: 'Which five constructors got the largest share of their 2017 points from podium finishes? Require at least 20 entries; report entries, total points, podium points, and the podium-point share.'
  reference_answer: 'The results were: constructor: Mercedes, entries: 40, total points: 668.0, podium points: 540.0, podium-point share: 80.84; constructor: Ferrari, entries: 40, total points: 522.0, podium points: 374.0, podium-point share: 71.65; constructor: Red Bull, entries: 40, total points: 368.0, podium points: 231.0, podium-point share: 62.77; constructor: Williams, entries: 40, total points: 83.0, podium points: 15.0, podium-point share: 18.07; constructor: Force India, entries: 40, total points: 187.0, podium points: 0.0, podium-point share: 0.0.'
  gold_sql: |-
    SELECT c.name AS constructor,
           COUNT(*) AS entries,
           ROUND(SUM(res.points), 3) AS total_points,
           ROUND(SUM(CASE WHEN res.position IN ('1', '2', '3') THEN res.points ELSE 0 END), 3) AS podium_points,
           ROUND(100.0 * SUM(CASE WHEN res.position IN ('1', '2', '3') THEN res.points ELSE 0 END) / SUM(res.points), 2) AS podium_point_share
    FROM results AS res
    JOIN races AS r ON r.raceId = res.raceId
    JOIN constructors AS c ON c.constructorId = res.constructorId
    WHERE r.year = 2017
    GROUP BY res.constructorId, c.name
    HAVING COUNT(*) >= 20 AND SUM(res.points) > 0
    ORDER BY podium_point_share DESC, total_points DESC
    LIMIT 5
- name: advanced_023
  question: 'Which five races from 2008-2017 had the largest gap between the race winner''s points and the median driver''s points? Require at least 10 result rows; report the leading driver, winner points, median points, and gap.'
  reference_answer: 'The results were: year: 2014, race: Abu Dhabi Grand Prix, leading driver: Lewis Hamilton, leader points: 50.0, median points: 1.0, gap: 49.0; year: 2010, race: Abu Dhabi Grand Prix, leading driver: Sebastian Vettel, leader points: 25.0, median points: 0.0, gap: 25.0; year: 2010, race: Australian Grand Prix, leading driver: Jenson Button, leader points: 25.0, median points: 0.0, gap: 25.0; year: 2010, race: Bahrain Grand Prix, leading driver: Fernando Alonso, leader points: 25.0, median points: 0.0, gap: 25.0; year: 2010, race: Belgian Grand Prix, leading driver: Lewis Hamilton, leader points: 25.0, median points: 0.0, gap: 25.0.'
  gold_sql: |-
    WITH race_points AS (
      SELECT r.raceId, r.year, r.name, res.driverId, SUM(res.points) AS points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year BETWEEN 2008 AND 2017
      GROUP BY r.raceId, r.year, r.name, res.driverId
    ), ranked AS (
      SELECT rp.*,
             ROW_NUMBER() OVER (PARTITION BY raceId ORDER BY points) AS rn,
             COUNT(*) OVER (PARTITION BY raceId) AS driver_count
      FROM race_points AS rp
    ), medians AS (
      SELECT raceId, year, name,
             AVG(CASE WHEN rn IN ((driver_count + 1) / 2, (driver_count + 2) / 2) THEN points END) AS median_points
      FROM ranked
      GROUP BY raceId, year, name
      HAVING driver_count >= 10
    ), winners AS (
      SELECT r.raceId, res.driverId, SUM(res.points) AS winner_points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year BETWEEN 2008 AND 2017 AND res.position = '1'
      GROUP BY r.raceId, res.driverId
    )
    SELECT m.year, m.name, d.forename || ' ' || d.surname AS winning_driver,
           ROUND(w.winner_points, 3) AS winner_points,
           ROUND(m.median_points, 3) AS median_points,
           ROUND(w.winner_points - m.median_points, 3) AS winner_median_gap
    FROM medians AS m
    JOIN winners AS w ON w.raceId = m.raceId
    JOIN drivers AS d ON d.driverId = w.driverId
    ORDER BY winner_median_gap DESC, m.year, m.name
    LIMIT 5
- name: advanced_024
  question: 'Which five drivers increased their points per race by the largest percentage from 2008 to 2017, considering only drivers who scored points in both years? Report both race counts, both rates, and absolute and percentage growth.'
  reference_answer: 'The results were: driver: Sebastian Vettel, 2008 races: 18, 2017 races: 20, 2008 points per race: 1.944, 2017 points per race: 15.85, absolute growth: 13.906, percentage growth: 715.14; driver: Lewis Hamilton, 2008 races: 18, 2017 races: 20, 2008 points per race: 5.444, 2017 points per race: 18.15, absolute growth: 12.706, percentage growth: 233.37; driver: Kimi R�_ikk̦nen, 2008 races: 18, 2017 races: 20, 2008 points per race: 4.167, 2017 points per race: 10.25, absolute growth: 6.083, percentage growth: 146.0; driver: Felipe Massa, 2008 races: 18, 2017 races: 19, 2008 points per race: 5.389, 2017 points per race: 2.263, absolute growth: -3.126, percentage growth: -58.0; driver: Fernando Alonso, 2008 races: 18, 2017 races: 19, 2008 points per race: 3.389, 2017 points per race: 0.895, absolute growth: -2.494, percentage growth: -73.6.'
  gold_sql: |-
    WITH yearly AS (
      SELECT res.driverId, r.year,
             COUNT(DISTINCT res.raceId) AS races,
             SUM(res.points) AS points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year IN (2008, 2017)
      GROUP BY res.driverId, r.year
    ), paired AS (
      SELECT y08.driverId,
             y08.races AS races_2008, y17.races AS races_2017,
             y08.points AS points_2008, y17.points AS points_2017,
             y08.points / y08.races AS ppr_2008,
             y17.points / y17.races AS ppr_2017
      FROM yearly AS y08
      JOIN yearly AS y17 ON y17.driverId = y08.driverId AND y17.year = 2017
      WHERE y08.year = 2008 AND y08.points > 0 AND y17.points > 0
    )
    SELECT d.forename || ' ' || d.surname AS driver,
           races_2008, races_2017,
           ROUND(ppr_2008, 3) AS points_per_race_2008,
           ROUND(ppr_2017, 3) AS points_per_race_2017,
           ROUND(ppr_2017 - ppr_2008, 3) AS absolute_growth,
           ROUND(100.0 * (ppr_2017 - ppr_2008) / ppr_2008, 2) AS percentage_growth
    FROM paired AS p
    JOIN drivers AS d ON d.driverId = p.driverId
    ORDER BY percentage_growth DESC, absolute_growth DESC
    LIMIT 5
- name: advanced_025
  question: 'Which five driver-constructor pairings had the highest win rate from 2010-2017, considering only pairings with at least 20 starts? Report the pairing, starts, wins, and win rate.'
  reference_answer: 'The results were: constructor: Mercedes, driver: Lewis Hamilton, starts: 98, wins: 41, win rate: 41.84; constructor: Red Bull, driver: Sebastian Vettel, starts: 96, wins: 34, win rate: 35.42; constructor: McLaren, driver: Lewis Hamilton, starts: 58, wins: 10, win rate: 17.24; constructor: Mercedes, driver: Nico Rosberg, starts: 136, wins: 23, win rate: 16.91; constructor: Mercedes, driver: Valtteri Bottas, starts: 20, wins: 3, win rate: 15.0.'
  gold_sql: |-
    SELECT c.name AS constructor,
           d.forename || ' ' || d.surname AS driver,
           COUNT(*) AS starts,
           SUM(CASE WHEN res.position = '1' THEN 1 ELSE 0 END) AS wins,
           ROUND(100.0 * SUM(CASE WHEN res.position = '1' THEN 1 ELSE 0 END) / COUNT(*), 2) AS win_rate
    FROM results AS res
    JOIN races AS r ON r.raceId = res.raceId
    JOIN constructors AS c ON c.constructorId = res.constructorId
    JOIN drivers AS d ON d.driverId = res.driverId
    WHERE r.year BETWEEN 2010 AND 2017
    GROUP BY res.constructorId, res.driverId, c.name, d.forename, d.surname
    HAVING COUNT(*) >= 20
    ORDER BY win_rate DESC, wins DESC, starts DESC
    LIMIT 5
- name: advanced_026
  question: 'Which five seasons from 2008-2017 had the largest gap between the leading constructor''s points and the median constructor''s points? Report the leading constructor, leader points, median points, and gap.'
  reference_answer: 'The results were: year: 2016, leading constructor: Mercedes, leader points: 765.0, median points: 76.0, gap: 689.0; year: 2015, leading constructor: Mercedes, leader points: 703.0, median points: 78.0, gap: 625.0; year: 2017, leading constructor: Mercedes, leader points: 668.0, median points: 70.0, gap: 598.0; year: 2011, leading constructor: Red Bull, leader points: 650.0, median points: 56.5, gap: 593.5; year: 2014, leading constructor: Mercedes, leader points: 701.0, median points: 155.0, gap: 546.0.'
  gold_sql: |-
    WITH constructor_points AS (
      SELECT r.year, cr.constructorId, SUM(cr.points) AS points
      FROM constructorResults AS cr
      JOIN races AS r ON r.raceId = cr.raceId
      WHERE r.year BETWEEN 2008 AND 2017
      GROUP BY r.year, cr.constructorId
    ), ranked AS (
      SELECT cp.*,
             ROW_NUMBER() OVER (PARTITION BY year ORDER BY points) AS rn,
             COUNT(*) OVER (PARTITION BY year) AS constructor_count,
             MAX(points) OVER (PARTITION BY year) AS leader_points,
             FIRST_VALUE(constructorId) OVER (PARTITION BY year ORDER BY points DESC, constructorId) AS leader_id
      FROM constructor_points AS cp
    ), season_stats AS (
      SELECT year, leader_id, leader_points,
             AVG(CASE WHEN rn IN ((constructor_count + 1) / 2, (constructor_count + 2) / 2) THEN points END) AS median_points
      FROM ranked
      GROUP BY year, leader_id, leader_points
    )
    SELECT s.year, c.name AS leading_constructor,
           ROUND(s.leader_points, 3) AS leader_points,
           ROUND(s.median_points, 3) AS median_points,
           ROUND(s.leader_points - s.median_points, 3) AS leader_median_gap
    FROM season_stats AS s
    JOIN constructors AS c ON c.constructorId = s.leader_id
    ORDER BY leader_median_gap DESC, s.year
    LIMIT 5
- name: advanced_027
  question: 'Which five long-career drivers were the most reliable from 2010-2017? Require at least 100 starts and 20 top-five finishes; report classified rate, retirements, and top-five rate.'
  reference_answer: 'The results were: driver: Sebastian Vettel, starts: 156, top-five finishes: 123, classified rate: 90.38, retirements: 15, top-five rate: 78.85; driver: Nico Rosberg, starts: 136, top-five finishes: 75, classified rate: 89.71, retirements: 14, top-five rate: 55.15; driver: Felipe Massa, starts: 155, top-five finishes: 41, classified rate: 89.03, retirements: 17, top-five rate: 26.45; driver: Lewis Hamilton, starts: 156, top-five finishes: 118, classified rate: 88.46, retirements: 18, top-five rate: 75.64; driver: Daniel Ricciardo, starts: 129, top-five finishes: 46, classified rate: 87.6, retirements: 16, top-five rate: 35.66.'
  gold_sql: |-
    SELECT d.forename || ' ' || d.surname AS driver,
           COUNT(*) AS starts,
           SUM(CASE WHEN res.positionOrder <= 5 THEN 1 ELSE 0 END) AS top_five_finishes,
           ROUND(100.0 * SUM(CASE WHEN res.positionText != 'R' THEN 1 ELSE 0 END) / COUNT(*), 2) AS classified_rate,
           SUM(CASE WHEN res.positionText = 'R' THEN 1 ELSE 0 END) AS retirements,
           ROUND(100.0 * SUM(CASE WHEN res.positionOrder <= 5 THEN 1 ELSE 0 END) / COUNT(*), 2) AS top_five_rate
    FROM results AS res
    JOIN races AS r ON r.raceId = res.raceId
    JOIN drivers AS d ON d.driverId = res.driverId
    WHERE r.year BETWEEN 2010 AND 2017
    GROUP BY res.driverId, d.forename, d.surname
    HAVING COUNT(*) >= 100
       AND SUM(CASE WHEN res.positionOrder <= 5 THEN 1 ELSE 0 END) >= 20
    ORDER BY classified_rate DESC, top_five_rate DESC
    LIMIT 5
- name: advanced_028
  question: 'Which five constructors showed the smallest average points gap between their top two scoring drivers per race from 2014-2017? Require at least 30 races with two drivers; report the number of races and both gap measures.'
  reference_answer: 'The results were: constructor: Manor Marussia, races with two drivers: 39, average top-two points gap: 0.03, largest top-two points gap: 1.0; constructor: Sauber, races with two drivers: 79, average top-two points gap: 0.42, largest top-two points gap: 8.0; constructor: Renault, races with two drivers: 41, average top-two points gap: 1.59, largest top-two points gap: 8.0; constructor: Haas F1 Team, races with two drivers: 41, average top-two points gap: 1.71, largest top-two points gap: 10.0; constructor: Lotus F1, races with two drivers: 38, average top-two points gap: 2.0, largest top-two points gap: 15.0.'
  gold_sql: |-
    WITH race_driver_points AS (
      SELECT res.constructorId, res.raceId, res.driverId, SUM(res.points) AS points
      FROM results AS res
      JOIN races AS r ON r.raceId = res.raceId
      WHERE r.year BETWEEN 2014 AND 2017
      GROUP BY res.constructorId, res.raceId, res.driverId
    ), ranked AS (
      SELECT rdp.*,
             ROW_NUMBER() OVER (PARTITION BY constructorId, raceId ORDER BY points DESC, driverId) AS driver_rank,
             COUNT(*) OVER (PARTITION BY constructorId, raceId) AS drivers_in_race
      FROM race_driver_points AS rdp
    ), teammate_gaps AS (
      SELECT constructorId, raceId,
             MAX(CASE WHEN driver_rank = 1 THEN points END) - MAX(CASE WHEN driver_rank = 2 THEN points END) AS points_gap
      FROM ranked
      WHERE drivers_in_race >= 2
      GROUP BY constructorId, raceId
    )
    SELECT c.name AS constructor,
           COUNT(*) AS races_with_two_drivers,
           ROUND(AVG(points_gap), 2) AS avg_top_two_points_gap,
           ROUND(MAX(points_gap), 2) AS largest_top_two_points_gap
    FROM teammate_gaps AS tg
    JOIN constructors AS c ON c.constructorId = tg.constructorId
    GROUP BY tg.constructorId, c.name
    HAVING COUNT(*) >= 30
    ORDER BY avg_top_two_points_gap ASC, races_with_two_drivers DESC
    LIMIT 5
- name: advanced_029
  question: Which five drivers had the best pole-to-win conversion with at least 10 poles?
  reference_answer: 'The ranked rates were: (Alberto, Ascari, 9, 14, 64.29); (Fernando, Alonso, 14, 22, 63.64); (Michael,
    Schumacher, 40, 68, 58.82); (Sebastian, Vettel, 29, 50, 58); (Lewis, Hamilton, 40, 72, 55.56).'
  gold_sql: |-
    WITH stats AS (SELECT driverId, COUNT(*) AS poles, SUM(CASE WHEN position = '1' THEN 1 ELSE 0 END) AS wins FROM results WHERE grid = 1 GROUP BY driverId) SELECT d.forename, d.surname, wins, poles, ROUND(100.0 * wins / poles, 2) AS conversion_pct FROM stats JOIN drivers AS d ON d.driverId = stats.driverId WHERE poles >= 10 ORDER BY conversion_pct DESC, wins DESC, d.driverId LIMIT 5
