    SELECT T1.driverid ,  T1.surname FROM drivers AS T1 JOIN laptimes AS T2 ON T1.driverid = T2.driverid ORDER BY T2.milliseconds DESC LIMIT 1
- name: formula_1_020
  question: "What is the id, forname and surname of the driver who had the first position in terms of laptime at least twice?"
  reference_answer: No driver had at least two first-position lap times.
  gold_sql: |
    SELECT T1.driverid ,  T1.forename ,  T1.surname FROM drivers AS T1 JOIN laptimes AS T2 ON T1.driverid = T2.driverid WHERE POSITION  =  '1' GROUP BY T1.driverid HAVING count(*)  >=  2
- name: formula_1_022
  question: "How many drivers participated in the race Australian Grand Prix held in 2009?"
  reference_answer: The query returned 20 drivers for the 2009 Australian Grand Prix.
  gold_sql: |
    SELECT count(*) FROM results AS T1 JOIN races AS T2 ON T1.raceid = T2.raceid WHERE T2.name = "Australian Grand Prix" AND YEAR = 2009
- name: formula_1_024
  question: "How many drivers did not participate in the races held in 2009?"
  reference_answer: The query returned 25 distinct drivers for the 2009 races.
  gold_sql: |
    SELECT count(DISTINCT driverId) FROM results WHERE raceId NOT IN( SELECT raceId FROM races WHERE YEAR != 2009 )
- name: formula_1_026
  question: "Give me a list of names and years of races that had any driver whose forename is Lewis?"
  reference_answer: The query returned 208 race name/year rows for races involving a driver named Lewis, from 2007 through 2017.
  gold_sql: |
    SELECT T2.name ,  T2.year FROM results AS T1 JOIN races AS T2 ON T1.raceid = T2.raceid JOIN drivers AS T3 ON T1.driverid = T3.driverid WHERE T3.forename = "Lewis"
- name: formula_1_028
  question: "Find the forename and surname of drivers whose nationality is German?"
  reference_answer: The query returned 49 German driver name pairs.
