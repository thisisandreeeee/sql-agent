basic:
- name: basic_001
  question: How many races are in the database?
  reference_answer: There are 997 races.
  gold_sql: |-
    SELECT COUNT(*) FROM races
- name: basic_002
  question: Which driver has the most race wins, and how many wins do they have?
  reference_answer: Michael Schumacher has the most race wins with 91.
  gold_sql: |-
    SELECT d.forename, d.surname, COUNT(*) AS wins FROM results AS r JOIN drivers AS d ON d.driverId = r.driverId WHERE r.position = '1' GROUP BY d.driverId ORDER BY wins DESC LIMIT 1
- name: basic_003
  question: Which constructor has the most race wins, and how many wins does it have?
  reference_answer: Ferrari has the most race wins with 230.
  gold_sql: |-
    SELECT c.name, COUNT(*) AS wins FROM results AS r JOIN constructors AS c ON c.constructorId = r.constructorId WHERE r.position = '1' GROUP BY c.constructorId ORDER BY wins DESC LIMIT 1
- name: basic_004
  question: What is the name of the race held most recently?
  reference_answer: The most recent race was the Abu Dhabi Grand Prix.
  gold_sql: |-
    SELECT name FROM races ORDER BY date DESC LIMIT 1
- name: basic_005
  question: What is the name and date of the most recent race?
  reference_answer: The most recent race was the Abu Dhabi Grand Prix, held on 2018-11-25.
  gold_sql: |-
    SELECT name ,  date FROM races ORDER BY date DESC LIMIT 1
- name: basic_006
  question: Find the names of all races held in 2017.
  reference_answer: 'The 20 races held in 2017 were: Australian Grand Prix; Chinese Grand Prix; Bahrain Grand Prix; Russian
    Grand Prix; Spanish Grand Prix; Monaco Grand Prix; Canadian Grand Prix; Azerbaijan Grand Prix; Austrian Grand Prix; British
    Grand Prix; Hungarian Grand Prix; Belgian Grand Prix; Italian Grand Prix; Singapore Grand Prix; Malaysian Grand Prix;
    Japanese Grand Prix; United States Grand Prix; Mexican Grand Prix; Brazilian Grand Prix; Abu Dhabi Grand Prix.'
  gold_sql: |-
    SELECT name FROM races WHERE YEAR = 2017
- name: basic_007
  question: Find the distinct names of all races held between 2014 and 2017?
  reference_answer: 'The 22 distinct race names from 2014 through 2017 were: Australian Grand Prix; Malaysian Grand Prix;
    Bahrain Grand Prix; Chinese Grand Prix; Spanish Grand Prix; Monaco Grand Prix; Canadian Grand Prix; Austrian Grand Prix;
    British Grand Prix; German Grand Prix; Hungarian Grand Prix; Belgian Grand Prix; Italian Grand Prix; Singapore Grand Prix;
    Japanese Grand Prix; Russian Grand Prix; United States Grand Prix; Brazilian Grand Prix; Abu Dhabi Grand Prix; Mexican
    Grand Prix; European Grand Prix; Azerbaijan Grand Prix.'
  gold_sql: |-
    SELECT DISTINCT name FROM races WHERE YEAR BETWEEN 2014 AND 2017
- name: basic_008
  question: How many drivers participated in the race Australian Grand Prix held in 2009?
  reference_answer: There were 20 drivers for the 2009 Australian Grand Prix.
  gold_sql: |-
    SELECT count(*) FROM results AS T1 JOIN races AS T2 ON T1.raceid = T2.raceid WHERE T2.name = "Australian Grand Prix" AND YEAR = 2009
- name: basic_009
  question: How many drivers did not participate in the races held in 2009?
  reference_answer: There were 817 drivers who did not participate in any race held in 2009.
  gold_sql: |-
    SELECT count(*) FROM drivers AS d WHERE d.driverId NOT IN (
      SELECT DISTINCT r.driverId
      FROM results AS r
      JOIN races AS ra ON r.raceId = ra.raceId
      WHERE ra.year = 2009
    )
