- name: formula_1_012
  question: "List the forename and surname of all distinct drivers who once had laptime less than 93000 milliseconds?"
  reference_answer: >-
    No drivers had a lap time under 93000 milliseconds.
  gold_sql: |
    SELECT DISTINCT T1.forename ,  T1.surname FROM drivers AS T1 JOIN laptimes AS T2 ON T1.driverid = T2.driverid WHERE T2.milliseconds < 93000
- name: formula_1_014
  question: "Find all the distinct id and nationality of drivers who have had laptime more than 100000 milliseconds?"
  reference_answer: >-
    No drivers had a lap time over 100000 milliseconds.
  gold_sql: |
    SELECT DISTINCT T1.driverid ,  T1.nationality FROM drivers AS T1 JOIN laptimes AS T2 ON T1.driverid = T2.driverid WHERE T2.milliseconds >  100000
