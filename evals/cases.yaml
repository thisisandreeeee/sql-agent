- name: advanced_086
  question: Which five circuits had the highest average fastest-lap speed with at least 20 recorded results?
  reference_answer: 'The cross-entity results were: (Autodromo Nazionale di Monza, 240.783, 289); (Circuit de Spa-Francorchamps,
    224.268, 257); (Silverstone Circuit, 219.019, 287); (Red Bull Ring, 217.81, 79); (Istanbul Park, 215.231, 147).'
  gold_sql: |-
    SELECT ci.name, ROUND(AVG(res.fastestLapSpeed), 3) AS average_speed, COUNT(*) AS recorded FROM results AS res JOIN races AS r ON r.raceId = res.raceId JOIN circuits AS ci ON ci.circuitId = r.circuitId WHERE res.fastestLapSpeed IS NOT NULL AND res.fastestLapSpeed != '' GROUP BY ci.circuitId, ci.name HAVING COUNT(*) >= 20 ORDER BY average_speed DESC, ci.name LIMIT 5
