- name: basic_096
  question: Which driver-win ranks are tied among the top three ranks?
  reference_answer: 'The top driver-win ranks were: (Michael, Schumacher, 91, 1); (Lewis, Hamilton, 62, 2); (Alain, Prost,
    51, 3).'
