- name: formula_1_002
  question: Which driver has the most race wins, and how many wins do they have?
  reference_answer: Michael Schumacher has the most race wins with 91.
  gold_sql: |
    SELECT d.forename, d.surname, COUNT(*) AS wins FROM results AS r JOIN drivers AS d ON d.driverId = r.driverId WHERE r.position = '1' GROUP BY d.driverId ORDER BY wins DESC LIMIT 1
