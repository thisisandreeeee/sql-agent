- name: advanced_083
  question: Who was the top-scoring driver for each constructor in 2017?
  reference_answer: 'The cross-entity results were: (Mercedes, Lewis, Hamilton, 363); (Ferrari, Sebastian, Vettel, 317); (Red
    Bull, Daniel, Ricciardo, 200); (Force India, Sergio, P̩rez, 100); (Toro Rosso, Carlos, Sainz, 48).'
  gold_sql: |-
    WITH points AS (SELECT res.constructorId, res.driverId, SUM(res.points) AS points FROM results AS res JOIN races AS r ON r.raceId = res.raceId WHERE r.year = 2017 GROUP BY res.constructorId, res.driverId), ranked AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY constructorId ORDER BY points DESC, driverId) AS rank FROM points) SELECT c.name, d.forename, d.surname, ranked.points FROM ranked JOIN constructors AS c ON c.constructorId = ranked.constructorId JOIN drivers AS d ON d.driverId = ranked.driverId WHERE rank = 1 ORDER BY ranked.points DESC, c.name LIMIT 5
- name: advanced_084
  question: Which five constructors scored the most points at a single circuit?
  reference_answer: 'The cross-entity results were: (Ferrari, Autodromo Nazionale di Monza, 517); (Ferrari, Circuit de Monaco,
    427.5); (Ferrari, Aut_dromo Jo Carlos Pace, 358); (Ferrari, Circuit Gilles Villeneuve, 345); (Ferrari, Silverstone Circuit,
    345).'
  gold_sql: |-
    SELECT c.name, ci.name, SUM(cr.points) AS points FROM constructorResults AS cr JOIN constructors AS c ON c.constructorId = cr.constructorId JOIN races AS r ON r.raceId = cr.raceId JOIN circuits AS ci ON ci.circuitId = r.circuitId GROUP BY cr.constructorId, r.circuitId ORDER BY points DESC, c.name, ci.name LIMIT 5
- name: advanced_085
  question: Which five constructor nationalities had the highest Finished share in 2017?
