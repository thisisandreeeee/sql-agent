- name: advanced_089
  question: Which five races had the largest result fields relative to their year average?
  reference_answer: 'The outlier results were: (1954, Indianapolis 500, 55, 29.444); (1953, Indianapolis 500, 47, 19.667);
    (1950, Indianapolis 500, 35, 12.143); (1951, Indianapolis 500, 34, 11.625); (1957, Indianapolis 500, 33, 11.625).'
  gold_sql: |-
    WITH race_counts AS (SELECT r.raceId, r.year, r.name, COUNT(*) AS entries FROM results AS res JOIN races AS r ON r.raceId = res.raceId GROUP BY r.raceId), yearly AS (SELECT year, AVG(entries) AS average_entries FROM race_counts GROUP BY year) SELECT race_counts.year, race_counts.name, race_counts.entries, ROUND(race_counts.entries - yearly.average_entries, 3) AS above_average FROM race_counts JOIN yearly ON yearly.year = race_counts.year ORDER BY above_average DESC, race_counts.year LIMIT 5
