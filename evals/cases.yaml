  reference_answer: 'The five largest seasons were: (2016, 21); (2018, 21); (2012, 20); (2017, 20); (2005, 19).'
  gold_sql: |-
    SELECT s.year, COUNT(r.raceId) AS races FROM seasons AS s JOIN races AS r ON r.year = s.year GROUP BY s.year ORDER BY races DESC, s.year LIMIT 5
- name: basic_081
  question: What were the average fastest-lap speeds from 2005 through 2010?
  reference_answer: 'The yearly average speeds were: (2005, 210.237); (2006, 205.182); (2007, 203.076); (2008, 201.82); (2009,
    202.206); (2010, 197.664).'
  gold_sql: |-
    SELECT r.year, ROUND(AVG(res.fastestLapSpeed), 3) AS average_speed FROM results AS res JOIN races AS r ON r.raceId = res.raceId WHERE r.year BETWEEN 2005 AND 2010 AND res.fastestLapSpeed IS NOT NULL AND res.fastestLapSpeed != '' GROUP BY r.year ORDER BY r.year
- name: basic_082
  question: Which five drivers raced in 2017 but not in 2016?
  reference_answer: 'The first five drivers in 2017 but not 2016 were: (Paul, di Resta); (Lance, Stroll); (Antonio, Giovinazzi);
    (Pierre, Gasly); (Brendon, Hartley).'
  gold_sql: |-
    SELECT d.forename, d.surname FROM drivers AS d WHERE d.driverId IN (SELECT res.driverId FROM results AS res JOIN races AS r ON r.raceId = res.raceId WHERE r.year = 2017) AND d.driverId NOT IN (SELECT res.driverId FROM results AS res JOIN races AS r ON r.raceId = res.raceId WHERE r.year = 2016) ORDER BY d.driverId LIMIT 5
