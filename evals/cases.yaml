- name: advanced_031
  question: Which five drivers had the most points per race from 2014 through 2017 with at least 20 starts?
  reference_answer: 'The ranked rates were: (Lewis, Hamilton, 79, 19.089); (Nico, Rosberg, 59, 17.356); (Sebastian, Vettel,
    79, 12.329); (Daniel, Ricciardo, 79, 9.949); (Valtteri, Bottas, 79, 9.013).'
